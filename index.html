<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2629">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <div class="brand" id="brand">Controle Financeiro</div>
      <div class="sync" id="sync"><span class="dot"></span><span id="sync-text">Conectando…</span></div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Atualizar">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <div class="chips" id="period-chips" role="tablist" aria-label="Período"></div>
</header>

<main id="view" aria-live="polite"></main>

<button class="fab" id="fab" aria-label="Novo lançamento">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="tabs">
  <button data-tab="inicio" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Início</span></button>
  <button data-tab="salgados"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 4 4 0 0 1-4-4 4 4 0 0 1-5-5z"/></svg><span>Salgados</span></button>
  <span class="tab-gap"></span>
  <button data-tab="servicos"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span>Serviços</span></button>
  <button data-tab="receber"><svg viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M17 14h.01"/></svg><span>A receber</span></button>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
